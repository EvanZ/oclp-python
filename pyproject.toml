[project]
name = "oclp"
version = "0.3.0a0"
description = "Reference Python SDK for the Open Computation Lifecycle Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Evan Zamir" },
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
duckdb = [
  "duckdb>=1.1,<2",
]
catboost = [
  "catboost>=1.2,<2",
]
xgboost = [
  "xgboost>=2.1,<4",
]
sklearn = [
  "scikit-learn>=1.6,<2",
  "skops>=0.12,<1",
]
parquet = [
  "pyarrow>=18,<24",
]
arrow = [
  "pyarrow>=18,<24",
]
numpy = [
  "numpy>=1.26,<3",
]
yaml = [
  "PyYAML>=6,<7",
]
toml = [
  "tomli-w>=1,<2",
]
xml = [
  "defusedxml>=0.7,<1",
]
lightgbm = [
  "lightgbm>=4.0,<5",
]

[project.scripts]
oclp = "oclp.cli:main"

[dependency-groups]
dev = [
  "duckdb>=1.1,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9",
]
docs = [
  "zensical>=0.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oclp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
