[project]
name = "oclp"
version = "0.1.0a0"
description = "Reference Python SDK for the Open Computation Lifecycle Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Evan Zamir" },
]
dependencies = [
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
duckdb = [
  "duckdb>=1.1,<2",
]

[project.scripts]
oclp = "oclp.cli:main"

[dependency-groups]
dev = [
  "duckdb>=1.1,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oclp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
