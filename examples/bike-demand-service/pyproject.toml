[project]
name = "oclp-bike-demand-service-demo"
version = "0.0.0"
description = "End-to-end OCLP example: bike-demand model training and inference service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2,<2",
  "fastapi>=0.115,<1",
  "oclp[duckdb]>=0.1.0a0",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "ucimlrepo>=0.0.7,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
bike-demand = "bike_demand_service.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9",
]

[tool.uv.sources]
oclp = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_demand_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
