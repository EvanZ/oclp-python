[project]
site_name = "OCLP Python SDK"
site_description = "Reference Python SDK for the Open Computation Lifecycle Protocol."
site_url = "https://evanz.github.io/oclp-python/"
repo_url = "https://github.com/EvanZ/oclp-python"
docs_dir = "docs"
