  {"How to Use" = "getting-started.md"},
  {"Tutorials" = [
    {"Bike-demand tutorial" = "bike-demand-example.md"},
  ]},
  {"Core API" = [
    {"API Overview" = "api-reference.md"},
    {"Artifacts" = "artifacts.md"},
    {"Computations and Executions" = "computations-and-executions.md"},
    {"Evidence" = "evidence.md"},
    {"Artifact sets" = "artifact-sets.md"},
    {"Runs" = "runs.md"},
    {"Sources and publishing" = "sources-and-publishing.md"},
  ]},
  {"Reference" = [
    {"Canonical records and validation" = "canonical-records.md"},
    {"Conformance" = "conformance.md"},
  ]},
  {"Integrations" = [
    {"Dagster" = "dagster.md"},
    {"MLflow" = "mlflow.md"},
    {"DuckDB catalog" = "catalog.md"},
  ]},
  {"Project" = [
    {"Roadmap" = "roadmap.md"},
  ]},
]

[project.theme]
variant = "modern"
features = ["navigation.path", "navigation.sections", "navigation.top", "toc.follow"]
